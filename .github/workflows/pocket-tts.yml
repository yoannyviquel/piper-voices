# Copie le modèle français de Pocket TTS (Kyutai, export ONNX de thewh1teagle/pocket-tts-onnx) depuis
# Hugging Face, injoignable depuis l'iPhone : raw.githubusercontent.com le servira à l'app Learning.
# GitHub refuse les fichiers de plus de 100 Mo : le modèle est découpé en morceaux, que l'app recolle.
name: Copier Pocket TTS (français)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pocket-tts.yml']

permissions:
  contents: write

jobs:
  copier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger, vérifier, découper
        run: |
          set -euo pipefail
          REPO=thewh1teagle/pocket-tts-onnx
          # La version figée : le commit Hugging Face du moment, noté dans source.json.
          REV=$(curl -fsSL "https://huggingface.co/api/models/$REPO" | jq -r .sha)
          BASE="https://huggingface.co/$REPO/resolve/$REV/fr"
          DIR=pocket-tts/fr
          rm -rf "$DIR" && mkdir -p "$DIR"
          curl -fsSL "$BASE/manifest.json" -o "$DIR/manifest.json"
          MODEL=$(jq -r .model.file "$DIR/manifest.json")
          ASSETS=$(jq -r .assets.file "$DIR/manifest.json")
          curl -fsSL "$BASE/$ASSETS" -o "$DIR/$ASSETS"
          curl -fsSL "$BASE/$MODEL" -o "$RUNNER_TEMP/model"
          WANT=$(jq -r '.model.sha256 // empty' "$DIR/manifest.json")
          GOT=$(sha256sum "$RUNNER_TEMP/model" | cut -d' ' -f1)
          # Le manifeste ne donne que le début de l'empreinte (16 caractères) : le fichier doit commencer par lui.
          case "$GOT" in "$WANT"*) echo "Empreinte vérifiée : $GOT" ;; *) echo "Empreinte inattendue : $GOT au lieu de $WANT…"; exit 1 ;; esac
          split -b 95000000 -d -a 2 "$RUNNER_TEMP/model" "$DIR/$MODEL.part"
          jq -n --arg repo "$REPO" --arg rev "$REV" --arg model "$MODEL" --arg sha "$GOT" \
            --argjson bytes "$(stat -c %s "$RUNNER_TEMP/model")" \
            --argjson parts "$(cd "$DIR" && ls "$MODEL".part* | jq -R . | jq -s .)" \
            '{source: ("https://huggingface.co/" + $repo), revision: $rev, model: {file: $model, bytes: $bytes, sha256: $sha, parts: $parts}}' > "$DIR/source.json"
          ls -la "$DIR" && cat "$DIR/source.json"
      - name: Commiter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pocket-tts
          git diff --cached --quiet && { echo "Rien de nouveau"; exit 0; }
          git commit -m "Pocket TTS français : copie depuis Hugging Face ($(jq -r .revision pocket-tts/fr/source.json | cut -c1-7))"
          git push
